services:
  - type: web
    name: asuncion-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: ohio
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: '*'
      - key: JWT_SECRET
        sync: false
      - key: STORAGE_TYPE
        value: local
      - key: SERVER_PORT
        value: 8080
      - key: APP_SEEDER_ENABLED
        value: 'false'
      - key: MONGODB_ENABLED
        value: 'false'
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseContainerSupport -Xmx220m -Xms96m -XX:MaxMetaspaceSize=192m -Xss256k -XX:+UseSerialGC"
