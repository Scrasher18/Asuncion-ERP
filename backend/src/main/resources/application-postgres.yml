# ==============================================================================
# Perfil "postgres": PostgreSQL 16 + PostGIS local (pgAdmin 4) o Cloud (Supabase/Neon)
# Mantiene almacenamiento local WebP (./uploads) para correr desde NetBeans sin Docker
# Para activarlo, cambia en application.yml -> active: postgres
# ==============================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asuncion_erp}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 64

app:
  seeder:
    enabled: ${APP_SEEDER_ENABLED:true}
  storage:
    type: local
    local:
      base-dir: ${LOCAL_STORAGE_DIR:./uploads}
      public-url: ${LOCAL_MEDIA_PUBLIC_URL:/api/v1/media}
