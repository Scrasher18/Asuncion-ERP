# ==============================================================================
# Perfil "postgres": PostgreSQL 16 + PostGIS local (pgAdmin 4) o Cloud (Supabase/Neon)
# Mantiene almacenamiento local WebP (./uploads) para correr desde NetBeans sin Docker
# Para activarlo, cambia en application.yml -> active: postgres
# ==============================================================================
spring:
  main:
    lazy-initialization: ${LAZY_INIT:true}
  jmx:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asuncion_erp}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      initialization-fail-timeout: -1
      data-source-properties:
        connectTimeout: 10
        socketTimeout: 30
        loginTimeout: 10
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 64

app:
  startup:
    async-warmup: ${ASYNC_WARMUP:true}
  seeder:
    enabled: ${APP_SEEDER_ENABLED:true}
  mail:
    frontend-base-url: ${FRONTEND_BASE_URL:https://asucionfrontend.vercel.app}
  chatbot:
    gemini-api-key: ${GEMINI_API_KEY:${APP_CHATBOT_GEMINI_API_KEY:}}
    gemini-model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
  storage:
    type: local
    local:
      base-dir: ${LOCAL_STORAGE_DIR:./uploads}
      public-url: ${LOCAL_MEDIA_PUBLIC_URL:/api/v1/media}
