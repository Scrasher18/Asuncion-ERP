spring:
  application:
    name: asuncion-erp-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 40MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:AsuncionCloudErpSuperSecretHmacKey2026EnterpriseSecurityKeyForStatelessJwtTokens987654321}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost,http://localhost:80}
  seeder:
    enabled: ${APP_SEEDER_ENABLED:true}
  chatbot:
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  peru-api:
    token: ${PERU_API_TOKEN:}
  mail:
    async: ${APP_MAIL_ASYNC:true}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  recaptcha:
    enabled: ${RECAPTCHA_ENABLED:true}
    site-key: ${RECAPTCHA_SITE_KEY:6LejIAouAAAAAEgaAefnpg5JDK4GFDbQth7ptvMc}
    secret-key: ${RECAPTCHA_SECRET_KEY:6LejIAouAAAAAEFS8XjmqQc_mO5ioOBw-AX-6cjI}
    min-score: ${RECAPTCHA_MIN_SCORE:0.5}
  nosql:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:asuncion_telemetry}
      enabled: ${MONGODB_ENABLED:true}
    storage-dir: ${NOSQL_STORAGE_DIR:./data/nosql}
