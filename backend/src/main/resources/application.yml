spring:
  application:
    name: asuncion-erp-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 40MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript,image/svg+xml
    min-response-size: 1024
  tomcat:
    threads:
      max: 20
      min-spare: 4
    max-connections: 100
    accept-count: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: false
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:DevDefaultJwtSecretKeyForLocalTestingOnly32BytesMinLength1234567890}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost,http://localhost:80}
  seeder:
    enabled: ${APP_SEEDER_ENABLED:true}
  chatbot:
    gemini-api-key: ${GEMINI_API_KEY:${APP_CHATBOT_GEMINI_API_KEY:}}
    gemini-model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
  peru-api:
    token: ${PERU_API_TOKEN:}
  mail:
    async: ${APP_MAIL_ASYNC:true}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  recaptcha:
    enabled: ${RECAPTCHA_ENABLED:false}
    site-key: ${RECAPTCHA_SITE_KEY:}
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    min-score: ${RECAPTCHA_MIN_SCORE:0.5}
  nosql:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:asuncion_telemetry}
      enabled: ${MONGODB_ENABLED:false}
    storage-dir: ${NOSQL_STORAGE_DIR:./data/nosql}
