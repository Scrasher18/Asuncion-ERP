spring:
  config:
    activate:
      on-profile: docker,prod
  main:
    lazy-initialization: ${LAZY_INIT:true}
  jmx:
    enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-postgis}:${DB_PORT:5432}/${DB_NAME:asuncion_erp}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:asuncion_admin}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

app:
  startup:
    async-warmup: ${ASYNC_WARMUP:true}
  storage:
    type: ${STORAGE_TYPE:s3}
    local:
      base-dir: ${LOCAL_STORAGE_DIR:/app/uploads}
      public-url: ${LOCAL_MEDIA_PUBLIC_URL:/api/v1/media}
    s3:
      endpoint: ${S3_ENDPOINT:http://minio:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:asuncion-media}
      public-url: ${S3_PUBLIC_URL:http://localhost:9000/asuncion-media}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:}
