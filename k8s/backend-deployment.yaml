# =========================================================================================
# PROYECTO: Repuestos Automotrices Asunción — Manifiesto Kubernetes Backend
# ARCHIVO: k8s/backend-deployment.yaml
# DESCRIPCIÓN: Deployment Stateless de Spring Boot 3 (Java 21 + Hibernate Spatial + WebP),
#              Service ClusterIP, PodDisruptionBudget y HorizontalPodAutoscaler (HPA v2).
# =========================================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asuncion-backend
  namespace: asuncion-prod
  labels:
    app.kubernetes.io/name: asuncion-backend
    app.kubernetes.io/component: api-erp
    app.kubernetes.io/part-of: repuestos-asuncion-erp
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: asuncion-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asuncion-backend
        app.kubernetes.io/component: api-erp
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - asuncion-backend
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: spring-boot-api
          image: ghcr.io/asuncion-automotriz/erp-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: asuncion-erp-config
            - secretRef:
                name: asuncion-erp-secrets
          env:
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
          resources:
            requests:
              cpu: "350m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1024Mi"
          # Startup Probe: otorga margen seguro al arranque inicial de Hibernate Spatial / HikariCP
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          # Liveness Probe: reinicia el pod si la JVM entra en deadlock
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 4
            failureThreshold: 3
          # Readiness Probe: verifica salud activa de PostgreSQL/PostGIS antes de recibir tráfico
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: asuncion-backend-svc
  namespace: asuncion-prod
  labels:
    app.kubernetes.io/name: asuncion-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: asuncion-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: asuncion-backend-hpa
  namespace: asuncion-prod
  labels:
    app.kubernetes.io/name: asuncion-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: asuncion-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: asuncion-backend-pdb
  namespace: asuncion-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asuncion-backend
